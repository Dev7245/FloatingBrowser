name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ler versão
        id: version
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo "1.0")
          CODE=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts || echo "1")
          echo "ver=$VER" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "Versão: $VER Build: $CODE"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear APK com versão
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          NOME="FloatingBrowser-v${{ steps.version.outputs.ver }}-b${{ steps.version.outputs.code }}.apk"
          echo "Renomeando para $NOME"
          cp "$APK" "$NOME"
          echo "NOME=$NOME" >> $GITHUB_ENV

      - name: Salvar APK versionado
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME }}
          path: ${{ env.NOME }}
          retention-days: 90
